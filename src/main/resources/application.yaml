spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pulsepass_db
    username: postgres
    password: admin
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

pulsepass:
  security:
    jwt:
      issuer: ${PULSEPASS_JWT_ISSUER:pulsepass-api}
      secret-base64: ${PULSEPASS_JWT_SECRET_BASE64}
      access-token-ttl: PT15M
    cors:
      allowed-origins: ${PULSEPASS_CORS_ORIGINS:}

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
